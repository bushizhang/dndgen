<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DnDGen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>DnDGen</h1>
      <p>Roll each category one at a time — or all at once</p>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('roller')">Roller</button>
      <button class="tab" onclick="showTab('config')">Edit config</button>
    </div>

    <div id="tab-roller">
      <div class="roll-area" id="rollArea">
        <div class="category-label" id="catLabel">Ready to roll</div>
        <div class="result-value" id="resultVal">—</div>
        <div class="result-sub" id="resultSub"></div>
        <div class="dice-badge" id="diceBadge"></div>
      </div>

      <div class="btn-row">
        <button class="primary" id="mainBtn" onclick="rollOne()" title="Shortcut: Space">Start rolling<span class="hotkey">Space</span></button>
        <div class="btn-row-secondary">
          <button id="allBtn" onclick="rollAll()" title="Shortcut: A">Roll all at once<span class="hotkey">A</span></button>
          <button id="rerollBtn" onclick="rerollLast()" style="display:none" title="Shortcut: R">Reroll last<span class="hotkey">R</span></button>
          <button id="exportBtn" onclick="exportImage()" style="display:none" title="Shortcut: E">Export as image<span class="hotkey">E</span></button>
          <button id="resetBtn" onclick="resetRoller()" style="display:none" title="Shortcut: S">Start over<span class="hotkey">S</span></button>
        </div>
      </div>

      <div class="progress" id="progress"></div>
      <div class="rolls-list" id="rollsList"></div>
    </div>

    <div id="tab-config" style="display:none">
      <p class="config-hint">
        Edit categories, options, and weights below. Higher weight = more likely to roll. Weights are relative, not percentages.
      </p>
      <div class="config-ui" id="configUI"></div>
      <button class="config-add-cat" onclick="addCategory()">+ Add category</button>
      <div class="edit-error" id="editError"></div>
      <div class="btn-row" style="margin-top: 1rem">
        <button class="primary" onclick="saveConfig()">Save config</button>
        <button onclick="resetConfig()">Reset to default</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>

  <!-- GoatCounter analytics -->
  <script data-goatcounter="https://thisillusion.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
